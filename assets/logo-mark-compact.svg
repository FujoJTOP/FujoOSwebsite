<svg
  xmlns="http://www.w3.org/2000/svg"
  viewBox="0 0 64 64"
  width="64"
  height="64"
  class="fujo-mark-compact"
  role="img"
  aria-labelledby="fujo-mark-compact-title"
>
  <title id="fujo-mark-compact-title">FujoOS</title>
  <desc id="fujo-mark-compact-desc">
    Favicon cut of the FujoOS mark: the same pencil, drawn larger so the point still reads at 16px.
  </desc>
  <style>
    .fujo-mark-compact .k { fill: var(--fujo-steel, #7fc4dc); }
    .fujo-mark-compact .p { fill: var(--fujo-amber, #e29a4a); }
    .fujo-mark-compact .r {
      fill: none;
      stroke: var(--fujo-steel, #7fc4dc);
      stroke-width: 3;
    }
    @media (prefers-color-scheme: light) {
      .fujo-mark-compact .k { fill: var(--fujo-steel, #266b87); }
      .fujo-mark-compact .p { fill: var(--fujo-amber, #a8651f); }
      .fujo-mark-compact .r { stroke: var(--fujo-steel, #266b87); }
    }
  </style>

  <g transform="translate(-27.8 -15.5) scale(1.47)">
    <path class="r" d="M5 50H24" />
    <g transform="translate(23 50) rotate(-45)">
      <path class="k" d="M0 0L13 -6H44V6H13Z" />
      <path class="p" d="M0 0L10 -4.62L10 4.62Z" />
    </g>
  </g>
</svg>
