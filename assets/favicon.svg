<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img"
     aria-label="FujoOS">
  <title>FujoOS</title>
  <!-- Favicon cut: the snow line sits lower and the zigzag is gentler, so the
       two-tone still reads after the browser has rasterised it at 16 px. -->
  <style>
    .fav-rock { fill: #5aa6c4; }
    .fav-snow { fill: #e3e9f1; }
    @media (prefers-color-scheme: light) {
      .fav-rock { fill: #266b87; }
      .fav-snow { fill: #ffffff; }
    }
  </style>
  <path class="fav-rock" d="M2,59 Q11,38 26,15 Q32,18 38,15 Q53,38 62,59 Z" />
  <path class="fav-snow" d="M14.6,35 Q17.5,22 26,15 Q32,18 38,15 Q46.5,22 49.4,35 L40,39 L31,30 Z" />
</svg>
