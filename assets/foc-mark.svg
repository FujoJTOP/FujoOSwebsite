<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256" role="presentation">
  <!-- FOC — the kernel. Same skeleton as the Loment mark: one translucent
       tile in #3d3a39 at 40%, one light letterform in #b8b3b0, flat, no
       gradient. What differs is the shape (a heptagon, not a squircle) and
       the letters (rectilinear paths, not a font, so nothing depends on a
       font being installed). -->
