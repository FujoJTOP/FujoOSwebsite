# Regenerate the site whenever source changes land on main.
#
# The generated HTML is committed, so a visitor still gets a static, zero-build
# site. What changed is *who* runs the generator: /admin/ writes fragments
# through the GitHub API from a browser, and a browser cannot run
# tools/docs.gen.mjs — it needs node:fs. So CI runs it and commits the result.
#
# The push below is made with GITHUB_TOKEN, and GitHub does not let events
# raised by GITHUB_TOKEN start new workflow runs. That is what stops this
# workflow from re-triggering itself — but the same rule means the commit may
# not ask Pages to rebuild either. So the rebuild is requested explicitly
# rather than assumed: without that, /admin/ would report success, CI would
# run, and the live site would quietly never change.

name: build

on:
  push:
    branches: [main]

permissions:
  contents: write # commit the regenerated output
  pages: write # POST /pages/builds

# one at a time; a queued run must not start from a half-written tree
concurrency:
  group: build
  cancel-in-progress: false

jobs:
  build:
    # belt and braces: GITHUB_TOKEN pushes do not trigger runs, and if that
    # ever changes this keeps the loop closed
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Regenerate
        run: node tools/docs.gen.mjs

      - name: Commit the output if it moved
        id: commit
        run: |
          if [ -z "$(git status --porcelain)" ]; then
            echo "nothing to commit — source and output already agree"
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Regenerate the site from source"
          git push
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Ask Pages to rebuild
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          code=$(curl -sS -o /tmp/pages.json -w '%{http_code}' -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/pages/builds")
          echo "Pages build request: HTTP $code"
          cat /tmp/pages.json || true
          # 201 = queued, 409 = one is already running (fine)
          case "$code" in
            201|409) exit 0 ;;
            *) echo "::error::Pages rebuild was not requested (HTTP $code)"; exit 1 ;;
          esac
