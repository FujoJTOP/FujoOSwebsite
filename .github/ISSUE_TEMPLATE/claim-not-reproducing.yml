name: 站上的主张复现不出来 / A claim that does not reproduce
description: 站上写了某句话，你按它给的命令跑，得到的不是它说的那个东西。 / The site says something, you run the command it gives, and what comes back is not that.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        判据只有一条：**站上写了某句话，你按它给的命令跑，得到的不是它说的那个东西**。
        缺了下面任何一项，这条 issue 会停在「需要更多信息」——不是刁难，是因为没有它就无法判定谁对。

        One criterion: the site says something, you run the command it gives, and what comes back is not that.
        Without any one of the fields below this stops at "needs more information" — not to be difficult, but
        because without it there is no way to tell which side is wrong.

  - type: input
    id: which-sentence
    attributes:
      label: 哪一句 / Which sentence
      description: 页面地址，或者原文。 / The page address, or the sentence itself.
      placeholder: https://fujojtop.github.io/FujoOSwebsite/docs/…
    validations:
      required: true

  - type: textarea
    id: command
    attributes:
      label: 你跑的命令 / The command you ran
      description: 原样贴，不要整理。整理过的命令跑出来的东西，通常正是分歧所在。 / Paste it verbatim, do not tidy it. A tidied command usually produces exactly the thing in dispute.
      render: shell
    validations:
      required: true

  - type: textarea
    id: got
    attributes:
      label: 你得到的输出 / What you got
      description: 原样贴。错误信息是整条报告里信息量最大的部分。 / Verbatim. The error message carries more than the rest of the report put together.
      render: shell
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: 你预期的输出 / What you expected
      description: 引用站上那句话就够了——它就是我们双方的对照物。 / Quoting the sentence from the site is enough — it is the object both sides measure against.
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: 版本 / Version
      description: 站上写的版本串；不确定就留空。 / The version string the site carries; leave it empty if unsure.
    validations:
      required: false

  - type: input
    id: environment
    attributes:
      label: 环境 / Environment
      description: OS、浏览器或工具链版本——只在确实相关时填。 / OS, browser or toolchain — only where it actually matters.
    validations:
      required: false
